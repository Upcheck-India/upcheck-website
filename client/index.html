<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale removed: it blocked pinch-zoom, which older farmers need on a phone in sunlight -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0067B1" />

    <title>Upcheck — Precision aquaculture for shrimp farmers</title>
    <meta
      name="description"
      content="Upcheck builds Neerani, the farm-management app for shrimp and fish producers in India — now free on Google Play — and Neero, a solar-powered pond sensor in development. Water, feed, growth, health and cycle economics in one record — offline, in six languages."
    />
    <link rel="canonical" href="https://www.upcheck.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Upcheck" />
    <meta property="og:url" content="https://www.upcheck.in/" />
    <meta property="og:title" content="Upcheck — Precision aquaculture for shrimp farmers" />
    <meta
      property="og:description"
      content="Neerani keeps every pond's water, feed, growth, health and money in one record — offline, in six languages. Now free on Google Play. Neero, our solar-powered pond sensor, is in development."
    />
    <meta property="og:image" content="https://www.upcheck.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Upcheck — precision aquaculture for shrimp farmers" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.upcheck.in/" />
    <meta name="twitter:title" content="Upcheck — Precision aquaculture for shrimp farmers" />
    <meta
      name="twitter:description"
      content="Neerani keeps every pond's water, feed, growth, health and money in one record — offline, in six languages. Now free on Google Play. Neero, our solar-powered pond sensor, is in development."
    />
    <meta name="twitter:image" content="https://www.upcheck.in/og-image.jpg" />

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Upcheck Technologies Private Limited",
        "alternateName": "Upcheck",
        "url": "https://www.upcheck.in/",
        "logo": "https://www.upcheck.in/favicon-512.png",
        "image": "https://www.upcheck.in/og-image.jpg",
        "description": "Upcheck builds Neerani, a farm-management app for shrimp and fish producers — free on Google Play — and Neero, a solar-powered floating pond sensor in development.",
        "sameAs": ["https://play.google.com/store/apps/details?id=com.upcheck.app"],
        "email": "admin@upcheck.in",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "areaServed": "IN",
        "knowsAbout": [
          "Shrimp aquaculture",
          "Pond water quality monitoring",
          "Aquaculture farm management",
          "Feed conversion ratio"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "admin@upcheck.in",
          "availableLanguage": ["English", "Tamil", "Telugu", "Hindi", "Bengali"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
